[build]
  command = "npm run build"
  publish = "dist"

# La app es SPA: cualquier ruta debe servir index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker no se debe cachear, si no nunca llegan los cambios
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
